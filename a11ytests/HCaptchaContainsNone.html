<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Web Page Without h Captcha</title>
</head>
<body>

<header>
    <h1>Welcome to Our Website</h1>
    <p>This is a simple webpage with a contact form that does not include h Captcha or any bot protection tools.</p>
</header>

<section>
    <h2>Contact Form</h2>
    <form action="submit_form.php" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Submit</button>
    </form>
</section>

<footer>
    <p>&copy; 2024 Basic Web Page. All rights reserved.</p>
</footer>

</body>
</html>
