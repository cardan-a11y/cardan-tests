<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usabilla Feedback Example</title>

    <!-- Usabilla Feedback Button Script -->
    <script type="text/javascript" src="https://w.usabilla.com/static/feedback.button.js" async="async"></script>

    <script>
        // Initialize Usabilla Feedback Button
        usabilla_live('click', 'YOUR_USABILLA_ID');
    </script>
</head>
<body>

<header>
    <h1>Welcome to Our Website</h1>
    <p>This page includes a Usabilla feedback button for gathering user feedback.</p>
</header>

<section>
    <h2>About Us</h2>
    <p>We are constantly looking to improve our services. Please use the feedback button to share your thoughts with
        us!</p>
</section>

<!-- Usabilla Feedback Button -->
<div class="usabilla_live_button">Leave Feedback</div>

<footer>
    <p>&copy; 2024 Usabilla Feedback Example. All rights reserved.</p>
</footer>

</body>
</html>
