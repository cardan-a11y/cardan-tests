<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha Integration Example</title>

    <!-- hCaptcha Script -->
    <script src="https://hcaptcha.com/1/api.js" async defer></script>
</head>
<body>

<header>
    <h1>hCaptcha Example Page</h1>
    <p>This page demonstrates the integration of hCaptcha, a tool to protect your website from bots and spam.</p>
</header>

<section>
    <h2>Contact Form</h2>
    <form action="submit_form.php" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <!-- hCaptcha Widget -->
        <div class="h-captcha" data-sitekey="YOUR_HCAPTCHA_SITE_KEY"></div>

        <button type="submit">Submit</button>
    </form>
</section>

<footer>
    <p>&copy; 2024 hCaptcha Example. All rights reserved.</p>
</footer>

</body>
</html>
